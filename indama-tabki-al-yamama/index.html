<title>عندما تبكي اليمامة - وسيم عقيل</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1931;color:#e8d5a3;font-family:'Amiri',serif;line-height:1.9}
.header{background:rgba(0,0,0,0.3);padding:25px 20px;text-align:center;border-bottom:2px solid rgba(212,175,55,0.3);position:sticky;top:0;backdrop-filter:blur(10px)}
.header h1{font-family:'Reem Kufi';color:#d4af37;font-size:28px}
.header p{color:#8a9bb8;font-size:14px;margin-top:5px}

.container{max-width:700px;margin:0 auto;padding:30px 20px}
.poem{background:rgba(255,255,255,0.04);border-right:3px solid #d4af37;border-radius:12px;padding:22px;margin-bottom:20px;transition:0.3s}
.poem:hover{background:rgba(255,255,255,0.07)}
.poem h3{font-family:'Reem Kufi';color:#d4af37;font-size:18px;margin-bottom:12px}
.poem p{white-space:pre-line;font-size:17px}
.footer{text-align:center;padding:30px;color:#5a6a85;font-size:13px}

</head>
