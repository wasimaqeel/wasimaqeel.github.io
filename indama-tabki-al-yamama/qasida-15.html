<h1>يَا فَاتِنَه</
            غْلَقْتِ بَابَ الوَصْلِ دُونَ مُبَرَّرٍأ
وَتَرَكْتِنِي أَبْكِي عَلَى الأَعْتَابِ

قَدْ كُنْتُ أَحْسَبُ أَنَّ وُدَّكِ دَائِمٌ
فَإِذَا بِوُدِّكِ زَائِلٌ كَسَرَابِ

أَسْقَيْتِنِي شَهْدَ الوِصَالِ بِحُلْوَةٍ
وَسَقَيْتِنِي بَعْدَ الوِصَالِ عَذَابِ

أَيَهُونُ قَلْبِي عِنْدَكِ وَهْوَ الَّذِي
أَفْنَى عَلَيْكِ تَلَهُّفَ الأَحْبَابِ

مَا ضَرَّ لَوْ عَاتَبْتِنِي بِرِفْقَةٍ
إِنَّ العِتَابَ لِأَهْلِهِ آدَابِ

عُودِي فَإِنَّ الشَّوْقَ أَتْلَفَ مُهْجَتِي
وَالقَلْبُ بَعْدَكِ تَائِهٌ مُنْسَابِ

لَا تَحْسَبِي أَنَّ الجَفَاءَ يَرُدُّنِي
عَنِّي فَإِنَّكِ أَنْتِ كُلُّ كِتَابِي

أَنَا مَا نَسِيتُكِ لَحْظَةً وَلَطَالَمَا
أَخْفَيْتُ حُزْنِي فِي ثِيَابِ تَصَابِي

فَإِذَا رَأَيْتِ الدَّمْعَ فِي عَيْنَيَّ لَا
تَتَعَجَّبِي فَالدَّمْعُ سِرُّ جَوَابِي
<div class="box">

<div class="author">— وَسِيم عَقِيل
من ديوان عندما تبكي اليمامة</div>
