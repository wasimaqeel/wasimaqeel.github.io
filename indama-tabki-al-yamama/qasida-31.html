<div class="header">
<h1>إعتراف</h1>
<div class="line"></div>
</div>
<div class="poem"اِسْتَبَحْتُكَ يَا وَرَقْ - 

اِسْتَبَحْتُكَ يَا وَرَقْ
وَمِنْ بَنَاتِ شَيْطَانِي مَدَدْتُ يَدَ اليَرَاعِ...
لِأَرْوِيَ فِيكَ شَغَفِي...
لِأَشْفِيَ فِيكَ مَرَضِي...
لِأَسْتَبِيحَكَ يَا وَرَقْ...

وَفَوْقَ عُذْرِيَّتِكَ...
رَوَيْتُ بَعْضَ الأَكَاذِيبِ...
بَلْ كُلَّ الأَكَاذِيبِ....
مَدَحْتُ حَقِيرًا.. أَهَنْتُ أَمِيرًا...
قَبَّحْتُ طُهْرًا.. جَمَّلْتُ عُهْرًا...
أَلَّهْتُ صُبْحًا مَعَ أَرَقْ...
وَاسْتَبَحْتُكَ يَا وَرَقْ...

لَسْتَ مِنِّي.. وَلَسْتُ مِنْكْ...
لَا تَحْتَوِينِي...
اِنْفُرْنِي.. اُتْفُلْنِي.. غَادِرْنِي...
فَأَنَا زِنْدِيقٌ...
أُزَوِّرُ التَّارِيخَ إِنِ اِقْتَضَانِي لِأَحْمِيَ مَنْ سَرَقْ...

حُرُوفِي مَغْلُوطَةٌ...
كَلِمَاتِي مَغْلُوطَةٌ...
أَفْكَارِي.. قَلَمِي.. حِبْرِي..
حَتَّى أَصَابِعُ يَدِي مَغْلُوطَةٌ...
وَفِي كُلِّ مَا أَكْتُبُ فِيكَ أَبُثُّ أُغْلُوطَةً...
تَحْتَ ظِلِّ الحَرْفِ....
فِي الفَوَاصِلِ...
عَلَى هَامِشِ الهَامِشِ...
أُخْفِي أَفْكَارًا مَغْلُوطَةً...

لَا تَحْتَوِينِي يَا وَرَقْ....
فَأَنْتَ قِدِّيسٌ.. وَأَنَا مُلْحِدٌ أَسْتَجْدِيكْ...
مَرِيضٌ أَسْتَشْفِيكْ....
أَحْمَقٌ يَهْرُبُ مِنْكَ وَفِيكَ إِلَيْكْ....
لِيَنْجُوَ مِنْ غَرَقْ...
اِلْعَنِّي يَا وَرَقْ...

*— فَإِنِّي مَا كَتَبْتُكَ إِلَّا لِأَكْذِبْ —*

وَمَا مَسَسْتُ بَيَاضَكَ إِلَّا لَوَّثْتُهُ بِالحِبْرِ وَالعَرَقْ

كَمْ تُبْتُ فَوْقَكَ تَوْبَةً كَاذِبَةً
وَكَمْ حَلَفْتُ أَنْ لَا أَعُودَ، 
وَعُدْتُ لِلغَرَقْ

أَبِيعُ وَجْهِي فِي سُطُورِكَ عَلَّنِي
أَشْرِي قِنَاعًا آخَرَ يُخْفِي القَلَقْ

أَنَا كُلُّ شَيْءٍ فِيكَ إِلَّا صَادِقٌ
أَنَا كَاذِبٌ حَتَّى وَإِنْ قُلْبي صَدَق

فَمَزِّقْنِي يَا وَرَقْ إِنْ شِئْتَ وَانْتَقِمْ
لِبَيَاضِكَ المَسْفُوكِ ظُلْمًا وَاحْتَرِقْ

مَا عَادَ فِي قَلَمِي نَبِيٌّ يَهْتَدِي
مَاتَ الضَّمِيرُ بِدَاخِلِي ثم اختنق

إِنْ كُنْتُ أَكْتُبُ فَالخَطِيئَةُ حِرْفَتِي
وَإِنْ سَكَتُّ فَالخَطِيئَةُ في طبق

فَالْعَنِّي، الْعَنِّي، لَعَلَّ لَعْنَي
يغسل  ذَنْبًا فِي دَمِي قَدِ اِلْتَصَقْ
 استبحتك ياورق.   
وسيم عقيل</div>
