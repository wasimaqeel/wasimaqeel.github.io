<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>وسيم عقيل - الأعمال الكاملة</title>
<link href="https://fonts.googleapis.com/css2?family=Amiri:wght@400;700&family=Reem+Kufi:wght@700&display=swap" rel="stylesheet">
<style>
body{background:#0a1931;color:#e8d5a3;font-family:'Amiri',serif;margin:0;min-height:100vh;display:flex;justify-content:center;align-items:center;padding:20px}
.container{max-width:1000px;width:100%;text-align:center}
h1{font-family:'Reem Kufi';color:#d4af37;font-size:52px;margin-bottom:10px}
.subtitle{opacity:0.8;font-size:20px;margin-bottom:30px}
.books{display:grid;grid-template-columns:1fr 1fr;gap:30px}
@media(max-width:700px){.books{grid-template-columns:1fr}}
.book{border:2px solid #d4af37;border-radius:20px;overflow:hidden;background:rgba(212,175,55,0.07);text-decoration:none;color:#e8d5a3;transition:0.4s;display:block}
.book:hover{transform:translateY(-10px);box-shadow:0 15px 40px rgba(212,175,55,0.3)}
.book img{width:100%;height:480px;object-fit:cover}
.book .info{padding:20px}
.book h2{font-family:'Reem Kufi';color:#d4af37;font-size:26px;margin:0 0 5px}
.book p{opacity:0.8;margin:0}
</style>
</head>
<body>
<div class="container">
<h1>وسيم عقيل</h1>
<div class="subtitle">الأعمال الكاملة</div>
<div class="books">
<a href="diwan.html" class="book">
<img src="cover_yamama.png">
<div class="info"><h2>عندما تبكي اليمامة</h2><p>ديوان شعري</p></div>
</a>
<a href="kharbashaat.html" class="book">
<img src="cover_kharbashaat.png">
<div class="info"><h2>خربشات على جدران الذاكرة</h2><p>مجموعة نصوص أدبية</p></div>
</a>
</div>
<p style="margin-top:40px;opacity:0.5">تصميم: سلمى اليمامة 💛</p>
</div>
</body>
</html>
