<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>مكتبة وسيم عقيل</title>
<link href="https://fonts.googleapis.com/css2?family=Reem+Kufi:wght@400;700&family=Amiri:wght@400;700&display=swap" rel="stylesheet">
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a1931;color:#e8d5a3;font-family:'Amiri',serif;min-height:100vh}
.hero{text-align:center;padding:40px 20px 15px}
.hero img{width:130px;height:130px;border-radius:50%;border:3px solid #d4af37;object-fit:cover;box-shadow:0 0 25px rgba(212,175,55,0.3)}
.hero h1{font-family:'Reem Kufi';color:#d4af37;font-size:34px;margin:14px 0 5px}
.hero p{color:#8a9bb8;font-size:16px}
.library{max-width:800px;margin:15px auto;padding:20px;display:grid;grid-template-columns:1fr 1fr;gap:18px}
.book{background:linear-gradient(145deg, rgba(255,255,255,0.07), rgba(255,255,255,0.03));border:1.5px solid rgba(212,175,55,0.4);border-radius:16px;padding:22px 18px;text-align:center;transition:0.3s}
.book:hover{border-color:#d4af37;transform:translateY(-4px);box-shadow:0 10px 30px rgba(212,175,55,0.15)}
.book .cover{width:110px;height:110px;border-radius:50%;border:2.5px solid #d4af37;object-fit:cover;margin:0 auto 12px;display:block;box-shadow:0 0 15px rgba(212,175,55,0.2)}
.book h3{font-family:'Reem Kufi';color:#d4af37;margin-bottom:8px;font-size:17px;line-height:1.4}
.book p{color:#8a9bb8;font-size:13px;margin-bottom:14px}
.book a{display:inline-block;padding:9px 20px;border:1.5px solid #d4af37;border-radius:10px;color:#d4af37;text-decoration:none;font-weight:700;font-size:14px;transition:0.3s}
.book a:hover{background:#d4af37;color:#0a1931}
@media(max-width:600px){.library{grid-template-columns:1fr}}
</style>
</head>
<body>
<div class="hero">
<img src="Wassili.jpg" onerror="this.src='https://via.placeholder.com/130?text=W'">
<h1>مكتبة وسيم عقيل</h1>
<p>كاتب وروائي سوري</p>
</div>
<div class="library">

<div class="book">
<img class="cover" src="fi-tariqi-ila-almostashfa/cover.jpg">
<h3>في طريقي إلى المستشفى</h3>
<p>رواية - 3 فصول</p>
<a href="fi-tariqi-ila-almostashfa/">اقرأ الآن</a>
</div>

<div class="book">
<img class="cover" src="ana-wal-ankaboot/cover.jpg">
<h3>أنا والعنكبوت</h3>
<p>رواية - 10 فصول</p>
<a href="ana-wal-ankaboot/">اقرأ الآن</a>
</div>
<div class="book">
<img class="cover" src="indama-tabki-al-yamama/cover.jpg">
<h3>عندما تبكي اليمامة</h3>
<p>ديوان شعري</p>
<a href="indama-tabki-al-yamama/">اقرأ الآن</a>
</div>
<div class="book">
<img class="cover" src="kharbashat/cover_kharbashaat.jpg">
<h3>خربشات على جدران الذاكرة</h3>
<p>نصوص أدبية - 26 نص</p>
<a href="kharbashat/">اقرأ الآن</a>
</div>
</div>
</body>
</html>
