<div class="poem">
<h1>شذره</h1>
<div class="verse">
غريبان نحن
ومهما ابتعدنا
فطيفك
حول مراحي
يدور...
وعندي اليك حنين 
المرايا
ودفئ الخطايا
وريح البخور...
فلا الشوق
يسأم 
مني ويمضي
ولا النوم 
سقم العيون
يزور...
تعال فما عاد 
يجدي فراق
وعافت بناني خط 
السطور...
فما دام عيش 
لموسى النبي...
ولا طاب موت
بجوف القبور...
</div>
<p style="text-align:left; margin-top:30px; font-weight:bold;">— وسيم عقيل</p>
</div>
